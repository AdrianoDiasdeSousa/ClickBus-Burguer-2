<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Observações - ClickBus Burguer</title>

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/observacoes.css" />
  </head>

  <body>
    <header class="topo">
      <a href="index.html" class="area-logo">
        <img src="img/logo-topo.png" alt="Logo ClickBus Burguer" />
      </a>

      <a href="cardapio.html" id="botaoVoltarObservacoes" class="botao-voltar">
  ↩ Voltar
</a>
    </header>

    <main class="pagina-observacoes">
      <section class="observacoes-container">
       <h1 id="tituloObservacoes">Observações</h1>
  <div
  id="camposObservacoesIndividuais"
  class="campos-observacoes-individuais"
  ></div>

        <div class="botoes-observacoes">
          <a href="cardapio.html" class="btn-continuar">
            Continuar comprando
          </a>

          <button
            type="button"
            class="btn-salvar"
            onclick="salvarObservacaoPagina()"
          >
            Salvar
          </button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
    <script>
  const botaoVoltar = document.getElementById("botaoVoltarObservacoes");

  if (localStorage.getItem("origemObservacoes") === "carrinho") {
    botaoVoltar.href = "carrinho.html";
  }

  botaoVoltar.addEventListener("click", () => {
    localStorage.removeItem("origemObservacoes");
  });
</script>
  </body>
</html>
