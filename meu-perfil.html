
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />
  <title>Meu Perfil - ClickBus Burguer</title>

  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/meu-perfil.css" />
</head>

<body>
  <header class="topo">
    <a href="index.html" class="area-logo">
      <img src="img/logo-topo.png"
           alt="ClickBus Burguer" />
    </a>

    <a href="cardapio.html" class="botao-voltar">
      ↩ Voltar ao cardápio
    </a>
  </header>

  <main class="pagina-meu-perfil" id="conteudoPerfil" hidden>
    <h1>Meu Perfil</h1>
    <p>Gerencie seus dados e endereços de entrega.</p>

    <p id="mensagemPerfil" role="status"
       aria-live="polite"></p>

    <section class="perfil-container">
      <h2>Meus Dados</h2>

      <form id="formMeusDados">
        <label for="perfilNome">Nome completo</label>
        <input type="text" id="perfilNome"
               autocomplete="name" required />

        <label for="perfilCpf">CPF</label>
        <input type="text" id="perfilCpf"
               inputmode="numeric" maxlength="14"
               autocomplete="off" />

        <label for="perfilEmail">Email</label>
        <input type="email" id="perfilEmail"
               autocomplete="email" required />

        <label for="perfilTelefone">Telefone</label>
        <input type="tel" id="perfilTelefone"
               autocomplete="tel" required />

        <button type="submit" id="btnSalvarDados">
          Salvar alterações
        </button>
      </form>
    </section>

    <section class="perfil-container">
      <h2>Meus Endereços</h2>

      <p>
        Você precisa manter pelo menos um
        endereço cadastrado.
      </p>

      <div id="listaEnderecos" aria-live="polite">
        Carregando endereços...
      </div>

      <h3 id="tituloFormularioEndereco">
        Cadastrar novo endereço
      </h3>

      <form id="formEndereco">
        <input type="hidden" id="enderecoId" />

        <label for="enderecoCompleto">
          Endereço completo
        </label>

        <textarea
          id="enderecoCompleto"
          rows="4"
          maxlength="500"
          minlength="5"
          placeholder="Rua, número, bairro, cidade, estado, CEP e complemento"
          required
        ></textarea>

        <label>
          <input type="checkbox" id="enderecoPrincipal" />
          Definir como endereço principal
        </label>

        <button type="submit" id="btnSalvarEndereco">
          Salvar endereço
        </button>

        <button type="button"
                id="btnCancelarEdicaoEndereco"
                hidden>
          Cancelar edição
        </button>
      </form>
    </section>
  </main>

  <script src="api.js"></script>
  <script src="meu-perfil.js" defer></script>
</body>
</html>
