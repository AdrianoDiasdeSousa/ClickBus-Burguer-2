<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redefinir Senha - ClickBus Burguer</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/redefinir-senha.css" />
  </head>

  <body>
    <header class="topo">
      <a href="index.html" class="area-logo">
        <img src="img/logo-topo.png" alt="Logo ClickBus Burguer" />
      </a>

      <a href="login.html" class="botao-voltar">↩ Voltar</a>
    </header>

    <main class="pagina-redefinir">
      <section class="redefinir-container">
        <h1>Redefinir senha</h1>

        <form class="form-redefinir" onsubmit="redefinirSenha(event)">
          <label for="novaSenha">Nova senha</label>

          <div class="campo-senha-redefinir">
            <input
              type="password"
              id="novaSenha"
              placeholder="Digite a nova senha"
              minlength="6"
              autocomplete="new-password"
              required
            />

            <button
              type="button"
              class="botao-ver-senha"
              onclick="alternarVisibilidadeSenha('novaSenha', this)"
              title="Mostrar ou ocultar senha"
              aria-label="Mostrar senha"
            >
              👁️
            </button>
          </div>

          <label for="confirmarSenha">Confirmar nova senha</label>

          <div class="campo-senha-redefinir">
            <input
              type="password"
              id="confirmarSenha"
              placeholder="Confirme a nova senha"
              minlength="6"
              autocomplete="new-password"
              required
            />

            <button
              type="button"
              class="botao-ver-senha"
              onclick="alternarVisibilidadeSenha('confirmarSenha', this)"
              title="Mostrar ou ocultar senha"
              aria-label="Mostrar senha"
            >
              👁️
            </button>
          </div>

          <button type="submit" class="botao-salvar-senha">
            Salvar nova senha
          </button>
        </form>

        <p class="texto-login-nova-senha">
          Depois de salvar, faça login com sua nova senha.
        </p>
      </section>
    </main>

    <script src="api.js"></script>
    <script src="script.js"></script>
  </body>
</html>
